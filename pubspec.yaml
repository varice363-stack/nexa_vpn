name: nexa_vpn
description: Nexa VPN — production-grade VPN client. Clean Architecture, Riverpod, GoRouter, Material 3, glassmorphism dark UI.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.0.0

  # Navigation
  go_router: ^16.0.0

  # Typography
  google_fonts: ^6.2.1

  # Motion
  flutter_animate: ^4.5.0

  # Local storage
  shared_preferences: ^2.3.0

  # Secure storage (tokens / credentials)
  flutter_secure_storage: ^9.2.0

  # Diagnostics
  connectivity_plus: ^6.1.0

  # HTTP client
  http: ^1.2.0

  # App metadata
  package_info_plus: ^8.0.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

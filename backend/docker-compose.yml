version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: morok_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: morok
      POSTGRES_PASSWORD: morok_db_password_2026
      POSTGRES_DB: morok_vpn
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U morok -d morok_vpn"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: morok_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: "0.0.0.0"
      DATABASE_URL: "postgresql://morok:morok_db_password_2026@postgres:5432/morok_vpn?schema=public"
      JWT_SECRET: "morok_jwt_super_secret_key_2026_production_secure_777"
      CORS_ORIGINS: "*"
      OWNER_CODE: "MOROK_SECURE_OWNER_KEY_2026_9x8f7a2c1b4e5"
      UPLOADS_DIR: "uploads"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads

volumes:
  pgdata:
  backend_uploads:

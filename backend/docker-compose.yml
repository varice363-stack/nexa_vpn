version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: morok_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: morok
      POSTGRES_PASSWORD: morok_db_password_2026
      POSTGRES_DB: morok_vpn
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U morok -d morok_vpn"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: morok_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: "0.0.0.0"
      DATABASE_URL: "postgresql://morok:morok_db_password_2026@postgres:5432/morok_vpn?schema=public"
      JWT_SECRET: "morok_jwt_super_secret_key_2026_production_secure_777"
      CORS_ORIGINS: "*"
      OWNER_CODE: "MOROK-WJWY-4KCC-A7EC-JT9F"
      UPLOADS_DIR: "uploads"
      # TASK #030: куда выкладывать список ключей для ядра Xray. Файл читает
      # хостовый cron (deploy/xray-sync/sync-xray-clients.py), он же применяет
      # его к конфигу и дёргает SIGHUP. Если каталога нет (разработка) — синк тихо skip.
      XRAY_CLIENTS_FILE: "/var/lib/morok/xray-clients.json"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
      # двусторонний канал с узлом: бэкенд пишет список, хост читает его cron'ом
      - /var/lib/morok:/var/lib/morok
  admin:
    build:
      context: ../admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
    image: morok_admin:latest
    container_name: morok_admin
    restart: unless-stopped
    # network_mode: host — чтобы прокси /api → 127.0.0.1:3000 видел morok_backend,
    # который опубликован на хосте и не состоит в сети этого compose-файла.
    network_mode: host
    environment:
      NODE_ENV: production
      PORT: "8080"
      API_PROXY_ORIGIN: ${ADMIN_API_PROXY_ORIGIN:-http://127.0.0.1:3000}
    depends_on:
      - backend

volumes:
  pgdata:
  backend_uploads:

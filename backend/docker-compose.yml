version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: morok_postgres
    restart: unless-stopped
    environment:
      # Секреты живут в backend/.env (не в гите). Файл создаётся один раз при
      # установке: см. DEPLOY.md / deploy/bootstrap.sh.
      POSTGRES_USER: ${DB_USER:-morok}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?no-backend-env}
      POSTGRES_DB: ${DB_NAME:-morok_vpn}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U morok -d morok_vpn"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: morok_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: "0.0.0.0"
      DATABASE_URL: "postgresql://${DB_USER:-morok}:${DB_PASSWORD:?no-backend-env}@postgres:5432/${DB_NAME:-morok_vpn}?schema=public"
      JWT_SECRET: ${JWT_SECRET:?no-backend-env}
      # Пароль администратора панели (только для prisma:seed), код владельца
      # админ-эндпоинтов и адрес, которому разрешено ходить по http.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      OWNER_CODE: ${OWNER_CODE:?no-backend-env}
      # '*' был значением по умолчанию: бэкенд отдавал Access-Control-Allow-Origin
      # ЛЮБОМУ сайту вместе с credentials:true. Нативному приложению Origin не
      # нужен (Dart-клиент его не шлёт), поэтому переменная обязательна и
      # перечисляет только браузерские источники (панель, dev-сборки).
      CORS_ORIGINS: ${CORS_ORIGINS:?no-cors-origins-set}
      UPLOADS_DIR: "uploads"
      # TASK #030: куда выкладывать список ключей для ядра Xray. Файл читает
      # хостовый cron (deploy/xray-sync/build-xray-config.py), который собирает
      # из него конфиг ядра и перезапускает morok-xray. Если каталога нет
      # (разработка/другой сервер) — синк тихо skip, выдача ключа не падает.
      XRAY_CLIENTS_FILE: "/var/lib/morok/xray-clients.json"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
      # двусторонний канал с узлом: бэкенд пишет список, хост читает его cron'ом
      - /var/lib/morok:/var/lib/morok
  admin:
    build:
      context: ../admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
    image: morok_admin:latest
    container_name: morok_admin
    restart: unless-stopped
    # network_mode: host — чтобы прокси /api → 127.0.0.1:3000 видел morok_backend,
    # который опубликован на хосте и не состоит в сети этого compose-файла.
    network_mode: host
    environment:
      NODE_ENV: production
      PORT: "8080"
      API_PROXY_ORIGIN: ${ADMIN_API_PROXY_ORIGIN:-http://127.0.0.1:3000}
    depends_on:
      - backend

volumes:
  pgdata:
  backend_uploads:
